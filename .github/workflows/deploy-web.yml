# Baut die Flutter-Web-App bei jedem Push auf main und veröffentlicht sie
# auf GitHub Pages: https://<user>.github.io/<repo>/
name: Deploy Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Wortindex bauen (V.2 — entsteht beim Bauen, nie von Hand)
        run: dart run tool/vokab_index.dart

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test --no-pub

      - name: Build web
        # ⚠️ SUPABASE_* sind Secrets des Repositories. Fehlen sie, werden hier
        # leere Zeichenketten übergeben — dann ist `hasSupabaseConfig` falsch,
        # und VOX verhält sich exakt wie vor S.3: kein Konto, kein Netzaufruf
        # zu Supabase. Der Bau geht dabei NICHT kaputt, das ist Absicht.
        # Nur der `anon`-Schlüssel gehört hierher, niemals `service_role`.
        run: |
          flutter build web --release --no-pub --no-wasm-dry-run \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
