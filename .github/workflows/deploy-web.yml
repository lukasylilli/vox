# Baut die Flutter-Web-App bei jedem Push auf main und veröffentlicht sie
# auf GitHub Pages: https://<user>.github.io/<repo>/
name: Deploy Web App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ohne_id_waechter:
        description: "Wort-id-Wächter (L.1a) auslassen — NUR bewusst, z. B. wenn die Seite ganz weg ist"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Wortindex bauen (V.2 — entsteht beim Bauen, nie von Hand)
        run: dart run tool/vokab_index.dart

      - name: Veröffentlichte Wort-ids noch da? (L.1a)
        # Vergleich mit dem Index der LIVE-Seite — dem, was Nutzer wirklich
        # haben (Begründung: tool/vokab_ids_pruefen.dart). Nicht erreichbar
        # ⇒ rot. Nur ein Mensch kann den Wächter über „Run workflow" und
        # `ohne_id_waechter` bewusst auslassen (z. B. wenn die Seite ganz weg ist).
        if: ${{ !inputs.ohne_id_waechter }}
        run: |
          set -o pipefail  # sonst verschluckt `| tee` einen roten Wächter
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/assets/assets/vocab_index.json"
          code=$(curl -sS --compressed --retry 3 --retry-all-errors \
            -o /tmp/vocab_index_live.json -w '%{http_code}' "$url" || true)
          if [ "$code" != "200" ]; then
            echo "::error::Veröffentlichter Wortindex nicht abrufbar (HTTP $code): $url"
            exit 1
          fi
          dart run tool/vokab_ids_pruefen.dart /tmp/vocab_index_live.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test --no-pub

      - name: Build web
        # ⚠️ SUPABASE_* sind Secrets des Repositories. Fehlen sie, werden hier
        # leere Zeichenketten übergeben — dann ist `hasSupabaseConfig` falsch,
        # und VOX verhält sich exakt wie vor S.3: kein Konto, kein Netzaufruf
        # zu Supabase. Der Bau geht dabei NICHT kaputt, das ist Absicht.
        # Nur der `anon`-Schlüssel gehört hierher, niemals `service_role`.
        # ⚠️ L.3 Offline (2026-09-24): `--pwa-strategy=none` — Flutters eigener
        # Service Worker meldet sich seit 3.4x selbst ab und würde vox_sw.js
        # (nächster Schritt) im selben Bereich verdrängen. `--no-web-resources-cdn`
        # — CanvasKit kommt aus build/web statt von www.gstatic.com, sonst
        # startet VOX offline nie. tool/pwa/sw_bauen.cjs prüft beides.
        run: |
          flutter build web --release --no-pub --no-wasm-dry-run \
            --pwa-strategy=none --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Offline-Worker bauen (L.3 — vox_sw.js, Workbox)
        run: |
          set -o pipefail
          npm ci --prefix tool/pwa --no-audit --no-fund
          node tool/pwa/sw_bauen.cjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Offline-Test im echten Chrome (L.3)
        # Rot ⇒ kein Deploy. Ablauf und Begründung: tool/pwa/offline_test.cjs.
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" node tool/pwa/offline_test.cjs | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
