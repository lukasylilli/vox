# FILE: .github/workflows/build-runner.yml
# ZWECK: ALLE Code-Erzeugung rund um die Datenbank, aus der Ferne:
#   1. `dart run build_runner build` (app_database.g.dart, ~8.000 Zeilen)
#   2. Schema-Abzüge JEDER veröffentlichten Datenbank-Fassung (drift_schemas/)
#      — die alten aus dem echten Code von damals (Git-Geschichte), die
#      aktuelle aus dem Arbeitsstand (L.1b, 2026-09-16)
#   3. Hilfsdateien für den Migrationstest (test/generated_migrations/)
#
# WARUM DAS EXISTIERT: Claude hat kein Dart/Flutter im eigenen Container und
# kann das nicht selbst ausführen (PLAN.md → فاز S, S.0). Es reicht, die
# Tabellen in app_database.dart zu ändern und diesen Lauf anzustoßen — auf
# einem ZWEIG, nie direkt auf main.
#
# Committet NUR, wenn `flutter analyze` UND `flutter test` danach grün sind.
# Sonst bleibt das Repository unverändert und der Lauf endet rot — der
# Fehlertext steht dann als Annotation am Lauf (tool/ci_fehler_melden.sh).
name: build_runner ausführen

on:
  workflow_dispatch:
    inputs:
      grund:
        description: "Wofür (nur für das Protokoll, z. B. 'S.0b: LeitnerCards erweitert')"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-runner
  cancel-in-progress: false

env:
  # Erste je veröffentlichte schemaVersion (erster Commit des Repos,
  # 2026-09-13). Ältere Fassungen gab es hier nie.
  ERSTE_FASSUNG: "2"

jobs:
  generieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Volle Geschichte: die alten Schema-Fassungen kommen aus alten Commits.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: build_runner
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee /tmp/build_runner.log \
            || { tool/ci_fehler_melden.sh "build_runner" /tmp/build_runner.log; exit 1; }

      - name: Schema-Abzüge aller Fassungen (L.1b)
        # Je Fassung der LETZTE Commit, in dem app_database.dart diese
        # schemaVersion trägt — dort in einem eigenen Arbeitsbaum abziehen.
        # Jedes Mal alle neu: so kann kein alter Abzug veralten.
        run: |
          set -o pipefail
          aktuell=$(grep -o 'schemaVersion => [0-9]*' lib/core/database/app_database.dart | grep -o '[0-9]*$')
          echo "Aktuelle Fassung: $aktuell" | tee /tmp/schema.log
          rm -rf drift_schemas test/generated_migrations
          mkdir -p drift_schemas
          for v in $(seq "$ERSTE_FASSUNG" $((aktuell - 1))); do
            sha=""
            for c in $(git log --format=%H -- lib/core/database/app_database.dart); do
              if git show "$c:lib/core/database/app_database.dart" | grep -q "schemaVersion => $v;"; then
                sha="$c"; break
              fi
            done
            if [ -z "$sha" ]; then
              echo "Kein Commit mit schemaVersion $v gefunden" >> /tmp/schema.log
              tool/ci_fehler_melden.sh "Schema-Abzug" /tmp/schema.log; exit 1
            fi
            echo "Fassung $v ← $sha" | tee -a /tmp/schema.log
            git worktree add --detach "/tmp/fassung_$v" "$sha" >> /tmp/schema.log 2>&1
            ( cd "/tmp/fassung_$v" \
              && flutter pub get \
              && dart run drift_dev schema dump lib/core/database/app_database.dart \
                   "$GITHUB_WORKSPACE/drift_schemas/drift_schema_v$v.json" ) >> /tmp/schema.log 2>&1 \
              || { tool/ci_fehler_melden.sh "Schema-Abzug Fassung $v" /tmp/schema.log; exit 1; }
            git worktree remove --force "/tmp/fassung_$v"
          done
          dart run drift_dev schema dump lib/core/database/app_database.dart \
            "drift_schemas/drift_schema_v$aktuell.json" >> /tmp/schema.log 2>&1 \
            || { tool/ci_fehler_melden.sh "Schema-Abzug aktuell" /tmp/schema.log; exit 1; }
          dart run drift_dev schema generate drift_schemas/ test/generated_migrations/ >> /tmp/schema.log 2>&1 \
            || { tool/ci_fehler_melden.sh "Schema-Hilfsdateien" /tmp/schema.log; exit 1; }
          ls drift_schemas test/generated_migrations | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wortindex bauen (V.2 — entsteht beim Bauen, nie von Hand)
        run: dart run tool/vokab_index.dart

      - name: Analyze (vor dem Commit — nichts Kaputtes veröffentlichen)
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee /tmp/analyze.log \
            || { grep -E ' (error|warning) ' /tmp/analyze.log > /tmp/analyze_kurz.log || true
                 tool/ci_fehler_melden.sh "Analyze" /tmp/analyze_kurz.log; exit 1; }

      - name: Test
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tee /tmp/test_voll.log \
            || { flutter test --no-pub --reporter failures-only > /tmp/test.log 2>&1 || true
                 tool/ci_fehler_melden.sh "Test" /tmp/test.log; exit 1; }

      - name: Committen
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "### Nichts geändert" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "vox-build-runner"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "build_runner: generierter Code aktualisiert${{ inputs.grund != '' && format(' ({0})', inputs.grund) || '' }}"
          git push
          echo "### Committet" >> "$GITHUB_STEP_SUMMARY"
          git show --stat -1 >> "$GITHUB_STEP_SUMMARY"
